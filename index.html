<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joe Brain</title>
  <style>
    :root {
      --bg: #f5f5f0;
      --sidebar-bg: #ebebeb;
      --surface: #ffffff;
      --border: #d8d8d0;
      --text: #1a1a1a;
      --text-muted: #666;
      --accent: #5c8acc;
      --accent-light: #6d9be8;
      --user-bubble: #e8e8e2;
      --joe-bubble: #ffffff;
      --radius: 12px;
      --sidebar-w: 220px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      transition: margin-left 0.2s;
      flex-shrink: 0;
    }
    #sidebar.hidden { margin-left: calc(-1 * var(--sidebar-w)); }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1rem; font-weight: bold; }

    #sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    #model-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    #status-dot.loading { background: #f0a500; animation: pulse 1s infinite; }
    #status-dot.ready   { background: #4caf50; }
    #status-dot.error   { background: #e53935; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Settings panel */
    #settings-panel {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    #settings-panel label { display: block; margin-bottom: 4px; color: var(--text-muted); }
    #settings-panel input[type=range] { width: 100%; }
    #temp-val { font-weight: bold; }

    /* Main */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #sidebar-toggle {
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer; color: var(--text-muted);
    }
    #chat-title { font-size: 0.95rem; font-weight: bold; }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.joe  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .msg.joe .bubble {
      background: var(--joe-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      padding: 0 2px;
    }

    /* Typing indicator */
    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* Input */
    #input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #user-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      background: var(--bg);
      max-height: 120px;
      overflow-y: auto;
    }
    #user-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      width: 40px; height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }
     #send-btn:hover:not(:disabled) { background: var(--accent-light); }

    #expert-select {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    #expert-select:focus { border-color: var(--accent); outline: none; }

    .speak-btn {
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
      margin-top: 4px;
      display: inline-block;
      align-self: flex-start;
    }
    .speak-btn:hover { background: var(--user-bubble); color: var(--text); }

    /* Welcome */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
      text-align: center;
      padding: 20px;
    }
    #welcome h2 { font-size: 1.4rem; color: var(--text); }
    #welcome p  { font-size: 0.9rem; max-width: 300px; }
  </style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <span class="logo">🧠 Joe Brain</span>
  </div>

  <div id="settings-panel">
    <label>Temperature: <span id="temp-val">0.9</span></label>
    <input type="range" id="temp-slider" min="0.1" max="1.5" step="0.05" value="0.8" />
    <label style="margin-top:10px;">Max tokens: <span id="tokens-val">120</span></label>
    <input type="range" id="tokens-slider" min="20" max="400" step="10" value="120" />
    <label style="margin-top:10px;">Top-K: <span id="topk-val">40</span></label>
    <input type="range" id="topk-slider" min="0" max="100" step="1" value="0" />
  </div>

  <div style="flex:1"></div>

  <div id="sidebar-footer">
    <div id="model-status">
      <div id="status-dot" class="loading"></div>
      <span id="status-text">Loading model...</span>
    </div>
  </div>
</aside>

<main id="main">
  <div id="topbar">
    <button id="sidebar-toggle">☰</button>
    <span id="chat-title">Joe Brain</span>
  </div>

  <div id="messages">
    <div id="welcome">
      <h2>🧠 Joe Brain</h2>
      <p>A tiny neural network trained from scratch. Still learning — be patient with it!</p>
      <p style="font-size:0.7rem;color:#aaa">v13</p>
    </div>
  </div>

   <div id="input-area">
     <select id="expert-select"></select>
     <textarea id="user-input" placeholder="Type something..." rows="1" disabled></textarea>
     <button id="send-btn" disabled>➤</button>
   </div>
</main>

<script>
  const $ = id => document.getElementById(id);

  // UI refs
  const messages   = $('messages');
  const input      = $('user-input');
  const sendBtn    = $('send-btn');
  const expertSelect = $('expert-select');
  const statusDot  = $('status-dot');
  const statusText = $('status-text');
  const tempSlider = $('temp-slider');
  const tempVal    = $('temp-val');
  const tokSlider  = $('tokens-slider');
  const tokVal     = $('tokens-val');
  const topkSlider = $('topk-slider');
  const topkVal    = $('topk-val');

  // Sidebar toggle
  $('sidebar-toggle').addEventListener('click', () => {
    $('sidebar').classList.toggle('hidden');
  });

   // Sliders
   tempSlider.addEventListener('input', () => { tempVal.textContent = tempSlider.value; });
   tokSlider.addEventListener('input',  () => { tokVal.textContent  = tokSlider.value; });
   topkSlider.addEventListener('input', () => { topkVal.textContent = topkSlider.value; });

   // Load experts into dropdown
   fetch('/experts').then(r => r.json()).then(data => {
     // Add "Auto" option first
     const autoOpt = document.createElement('option');
     autoOpt.value = '';
     autoOpt.textContent = '🔄 Auto (Router)';
     expertSelect.appendChild(autoOpt);
     data.experts.forEach(e => {
       const opt = document.createElement('option');
       opt.value = e.name;
       opt.textContent = e.name;
       expertSelect.appendChild(opt);
     });
     input.disabled = false;
     sendBtn.disabled = false;
   }).catch(() => {
     expertSelect.innerHTML = '<option>no experts</option>';
   });

   // Auto-resize textarea
   input.addEventListener('input', () => {
     input.style.height = 'auto';
     input.style.height = Math.min(input.scrollHeight, 120) + 'px';
   });

  // Send on Enter (Shift+Enter = newline)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  // ── Chat ──────────────────────────────────────────────────────────────────

  let history = [];  // [{role, text}, ...]

  function addMsg(role, text, routedTo) {
    const welcome = $('welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    
    // Check if Joe's response contains reasoning pattern
    const isReasoning = role === 'joe' && /^Let's think step by step/i.test(text);
    
    if (isReasoning) {
      const lines = text.split('\n');
      const reasoningLine = lines[0];
      const answerText = lines.slice(1).join('\n').trim();
      
      const routedLabel = routedTo ? ` · ${routedTo}` : '';
      div.innerHTML = `<div class="msg-label">🧠 Joe${routedLabel}</div>
                       <div class="answer-bubble bubble"></div>
                       <div class="reasoning-section" style="display:none; margin-top:8px;">
                         <div class="reasoning-bubble bubble" style="background:#fffde7; border:1px solid #ffeb3b;"></div>
                       </div>
                       <button class="toggle-reasoning" style="margin-top:6px; padding:4px 8px; font-size:0.75rem; background:#ffeb3b; border:none; border-radius:4px; cursor:pointer;">Show Reasoning</button>`;
      
      div.querySelector('.answer-bubble').textContent = answerText || text;
      div.querySelector('.reasoning-bubble').textContent = reasoningLine;
      
      const toggleBtn = div.querySelector('.toggle-reasoning');
      toggleBtn.addEventListener('click', function() {
        const section = div.querySelector('.reasoning-section');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
        toggleBtn.textContent = section.style.display === 'none' ? 'Show Reasoning' : 'Hide Reasoning';
      });

      if (window.speechSynthesis) {
        const speakBtn2 = document.createElement('button');
        speakBtn2.className = 'speak-btn';
        speakBtn2.textContent = '🔊 Read aloud';
        speakBtn2.title = 'Click to read aloud';
        speakBtn2.addEventListener('click', () => {
          if (speechSynthesis.speaking) { speechSynthesis.cancel(); speakBtn2.textContent = '🔊 Read aloud'; return; }
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.onend = () => { speakBtn2.textContent = '🔊 Read aloud'; };
          speakBtn2.textContent = '⏹ Stop';
          speechSynthesis.speak(utterance);
        });
        toggleBtn.parentNode.appendChild(speakBtn2);
      }

    } else {
      const routedLabel = routedTo ? ` · ${routedTo}` : '';
      div.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : '🧠 Joe' + routedLabel}</div>
                       <div class="bubble"></div>`;
      const bubbleEl = div.querySelector('.bubble');
      bubbleEl.textContent = text;
      if (role === 'joe' && window.speechSynthesis) {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.textContent = '🔊 Read aloud';
        speakBtn.title = 'Click to read aloud';
        speakBtn.addEventListener('click', () => {
          if (speechSynthesis.speaking) { speechSynthesis.cancel(); speakBtn.textContent = '🔊 Read aloud'; return; }
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.onend = () => { speakBtn.textContent = '🔊 Read aloud'; };
          speakBtn.textContent = '⏹ Stop';
          speechSynthesis.speak(utterance);
        });
        bubbleEl.parentNode.appendChild(speakBtn);
      }
    }
    
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div.querySelector('.bubble');
  }

  function addTyping() {
    const welcome = $('welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg joe';
    div.id = 'typing-indicator';
    div.innerHTML = `<div class="msg-label">🧠 Joe</div>
                     <div class="bubble"><div class="typing-dots">
                       <span></span><span></span><span></span>
                     </div></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  let sending = false;

  async function send() {
    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    input.disabled = true;

    addMsg('user', text);
    history.push(['user', text]);

    const typing = addTyping();

    const temperature = parseFloat(tempSlider.value);
    const maxNew = parseInt(tokSlider.value);
    const topK = parseInt(topkSlider.value);

    let reply = '';
    let routedTo = null;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    typing.querySelector('.bubble').replaceWith(bubble);

    if (history.length >= 2) {
        const prevJoe = history[history.length - 2][1];
        const prevDiv = document.createElement('div');
        prevDiv.style.marginTop = '8px';
        prevDiv.style.fontSize = '0.8rem';
        prevDiv.style.color = '#999';
        prevDiv.textContent = 'Joe: ' + prevJoe.substring(0, 100) + '...';
        bubble.parentNode.insertBefore(prevDiv, bubble);
    }

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          msg: text,
          expert: expertSelect.value,
          history: history.slice(0, -1),
          temperature,
          max_new: maxNew,
          top_k: topK
        })
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));
          if (data.done) {
            reply = data.reply;
            routedTo = data.routed_to;
          } else if (data.char !== undefined) {
            reply += data.char;
            bubble.textContent = reply || '...';
            messages.scrollTop = messages.scrollHeight;
          }
        }
      }

      if (!reply) bubble.textContent = '...';
      else bubble.textContent = reply;

      // Update label with routing info
      if (routedTo && routedTo.length > 0) {
        const label = typing.querySelector('.msg-label');
        if (label) {
          const routedStr = routedTo.join(', ');
          label.textContent = `🧠 Joe · ${routedStr}`;
        }
      }

      history.push(['joe', reply]);

      if (window.speechSynthesis && reply) {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.textContent = '🔊 Read aloud';
        speakBtn.title = 'Click to read aloud';
        speakBtn.addEventListener('click', () => {
          if (speechSynthesis.speaking) { speechSynthesis.cancel(); speakBtn.textContent = '🔊 Read aloud'; return; }
          const utterance = new SpeechSynthesisUtterance(reply);
          utterance.onend = () => { speakBtn.textContent = '🔊 Read aloud'; };
          speakBtn.textContent = '⏹ Stop';
          speechSynthesis.speak(utterance);
        });
        bubble.parentNode.appendChild(speakBtn);
      }

    } catch (e) {
      bubble.textContent = '[error: ' + e.message + ']';
    }

    sending = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }

  // ── Check server ──────────────────────────────────────────────────────────

  (async () => {
    try {
      statusDot.className = 'loading';
      statusText.textContent = 'Connecting...';
      
      // Add timeout to fetch
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      
      const resp = await fetch('/ping', { signal: controller.signal });
      clearTimeout(timeoutId);
      
      const data = await resp.json();
      if (data.ok) {
        statusDot.className = 'ready';
        statusText.textContent = 'Model ready';
        input.disabled = false;
        sendBtn.disabled = false;
        input.placeholder = 'Type something...';
        input.focus();
      }
    } catch (e) {
      statusDot.className = 'error';
      statusText.textContent = 'Server not running: ' + e.message;
      // Force enable anyway so you can try sending
      input.disabled = false;
      sendBtn.disabled = false;
    }
  })();
</script>
</body>
</html>
