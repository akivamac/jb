<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fa">
  <title>JoeBrain Training — Mobile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #dashboard { display: block; width: 100%; height: 100%; border: 0; }
    #load-error {
      display: none;
      margin: 24px;
      color: #cf222e;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <iframe id="dashboard" src="index.html" title="JoeBrain Training Dashboard"></iframe>
  <div id="load-error">This mobile view could not load <code>index.html</code>. Serve both files from the training dashboard server.</div>
  <script>
    (async () => {
      const frame = document.getElementById('dashboard');
      const error = document.getElementById('load-error');
      try {
        const response = await fetch('mobile.css', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load mobile.css');
        const css = await response.text();
        frame.addEventListener('load', () => {
          try {
            const doc = frame.contentDocument;
            if (!doc?.head) throw new Error('Dashboard unavailable');
            let style = doc.getElementById('joebrain-mobile-css');
            if (!style) {
              style = doc.createElement('style');
              style.id = 'joebrain-mobile-css';
              doc.head.appendChild(style);
            }
            style.textContent = css;
            doc.documentElement.style.minHeight = '100%';
            doc.body.style.minHeight = '100%';
          } catch (_) {
            frame.style.display = 'none';
            error.style.display = 'block';
          }
        });
      } catch (_) {
        frame.style.display = 'none';
        error.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
