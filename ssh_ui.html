<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoeBrain Training</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f6f8fa; --surface: #ffffff; --border: #d0d7de;
  --text: #1f2328; --text-dim: #656d76; --accent: #0969da;
  --accent-light: rgba(9,105,218,0.08); --success: #1a7f37;
  --success-light: rgba(26,127,55,0.08); --warn: #9a6700;
  --warn-light: rgba(154,103,0,0.08); --error: #cf222e;
  --error-light: rgba(207,34,46,0.08); --radius: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
.center { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; max-width: 480px; width: 90%; box-shadow: var(--shadow); text-align: center; }
h1 { font-size: 22px; margin-bottom: 8px; }
p { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }
.status { font-size: 48px; margin-bottom: 16px; }
.btn { display: inline-block; padding: 10px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.85; }
.btn-warn { background: var(--warn); color: #fff; }
.btn-mono { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
.cmd-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 13px; text-align: left; margin: 16px 0; word-break: break-all; position: relative; }
.copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 8px; font-size: 11px; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Chat */
.chat-box { display: none; margin-top: 16px; text-align: left; }
.chat-box.visible { display: block; }
.chat-messages { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; background: var(--bg); margin-bottom: 8px; font-size: 13px; }
.chat-msg { margin-bottom: 4px; }
.chat-msg.user { color: var(--accent); }
.chat-msg.joe { color: var(--success); }
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
.chat-input-row button { padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 14px; }
.chat-input-row button:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="center">
  <div class="card" id="card">
    <div id="status"></div>
    <h1 id="title"></h1>
    <p id="desc"></p>
    <div id="actions"></div>
    <div class="chat-box" id="chat-box">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask Joe anything..." onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>
<script>
var state = __STATE__;
var status = document.getElementById('status');
var title = document.getElementById('title');
var desc = document.getElementById('desc');
var actions = document.getElementById('actions');
var chatBox = document.getElementById('chat-box');
var chatMessages = document.getElementById('chat-messages');
var chatInput = document.getElementById('chat-input');

if (state === 'no_ssh') {
  status.textContent = '🛡️';
  title.textContent = 'No SSH Connection';
  desc.textContent = 'Connect to the Mac via SSH to access the training dashboard.';
  actions.innerHTML = '<div class="cmd-box"><span class="copy-btn" onclick="copyCmd()">Copy</span><code id="ssh-cmd">ssh -L 8888:localhost:8888 dev@[IP_ADDRESS]</code><br><small style="color:var(--text-dim)">Then open localhost:8888</small></div><br><button class="btn btn-warn" onclick="retry()">Retry</button>';
} else if (state === 'no_internet') {
  status.textContent = '🌐';
  title.textContent = 'No Internet';
  desc.textContent = 'Connect to the internet to access the training dashboard.';
  actions.innerHTML = '<button class="btn btn-primary" onclick="retry()">Retry</button>';
} else {
  status.textContent = '✅';
  title.textContent = 'Connected';
  desc.textContent = 'SSH verified. Training dashboard ready.';
  actions.innerHTML = '<button class="btn btn-success" onclick="window.location.href=\'http://localhost:8888\'">Open Dashboard</button>';
  chatBox.classList.add('visible');
}

function copyCmd() {
  var cmd = document.getElementById('ssh-cmd').textContent;
  navigator.clipboard.writeText(cmd).then(function() {
    var btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
  });
}

function retry() {
  fetch('/api/state').then(function(r) { return r.json(); }).then(function(d) {
    location.reload();
  }).catch(function() { location.reload(); });
}

function sendChat() {
  var msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = '';
  chatMessages.innerHTML += '<div class="chat-msg user">You: ' + msg + '</div>';
  fetch('/api/test?msg=' + encodeURIComponent(msg), {
    headers: { 'X-API-Key': API_KEY }
  })
    .then(function(r) { return r.text(); })
    .then(function(text) {
      chatMessages.innerHTML += '<div class="chat-msg joe">Joe: ' + text + '</div>';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    })
    .catch(function() {
      chatMessages.innerHTML += '<div class="chat-msg joe">Joe: Error. Try again.</div>';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
}
var API_KEY = '__API_KEY__';
</script>
</body>
</html>
